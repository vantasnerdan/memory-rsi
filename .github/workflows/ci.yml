name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python3 -m pip install ./cli
      - run: npm test
      - run: sh -n scripts/install.sh && git diff --check
      - run: npm pack --dry-run

  clean-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Packed clean-home bootstrap, migration, rerun and graph-only smoke
        run: node scripts/smoke-bootstrap.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-bootstrap-evidence
          path: |
            /tmp/memory-rsi-package-smoke-*/report.json
            /tmp/memory-rsi-package-smoke-*/logs/*.json
            /tmp/memory-rsi-package-smoke-*/logs/*.log

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ripgrep (required by memory grep)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install vendored CLI
        run: pip install -e ./cli
      - name: Run CLI test suite
        run: |
          pip install pytest
          pytest cli/tests
      - name: Smoke test console script and module fallback
        run: |
          memory --help >/dev/null
          python3 -m agent_memory --help >/dev/null
      - name: Verify wheel packaging
        run: python3 -m pip wheel --no-deps --wheel-dir /tmp/wheels ./cli
