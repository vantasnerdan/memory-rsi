[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory"
version = "0.2.0"
description = "Progressive disclosure memory management for autonomous agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/axis-marbell/agent-memory-cli"
Issues = "https://github.com/axis-marbell/agent-memory-cli/issues"

[project.scripts]
memory = "agent_memory.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
