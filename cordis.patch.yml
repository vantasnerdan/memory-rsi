# The memory-rsi bundle patch: inserts the agent-memory tool plugin
# as one host row over the base layer. Rows in later patch layers (the
# profile's cordis.patch.yml, $DSH_HOME/cordis.patch.yml, --patch) override
# this row by id and must restate every key they own, since a patch replaces
# the targeted row's whole `config`.

- insert:
    - id: memory-rsi
      name: memory-rsi
      config:
        # Console script to invoke; when missing from PATH the plugin falls
        # back to `pythonBin -m agent_memory` (the vendored CLI ships a
        # __main__ shim for exactly that).
        memoryBin: memory
        pythonBin: python3
        # Respect explicit/env/CLI-configured or detected existing memory. A new
        # installation falls back to this user's DSH_HOME/memory, not a project cwd.
        base: ""
        # Agent identity for writes and "own" scope. Exported to the CLI as
        # AGENT_ID and used as the default --author. Empty = host env.
        agentId: ""
        # Operator-owned allowlist for explicit managed policy sync. No default writes.
        instructionFiles: []
        # Empty derives a private runtime from this user's DSH_HOME; never install on import.
        runtimeDir: ""
        bootstrapPython: python3
        gitnexusBin: gitnexus
        gitnexusHome: ""
        gitnexusTimeoutMs: 120000
        setupTimeoutMs: 600000
        # Cooperative per-call timeout budget (ms).
        timeoutMs: 60000
        # Opt in only after reviewing policy/contract disclosure to TypeSafe.
        # Jev uses a typed decision API, not an OpenAI chat model entry.
        typesafeEnabled: false
        # Local metadata-only signal capture; explicit observe persists, mine discloses.
        rsiTelemetryEnabled: false
        rsiLearningTimeoutMs: 300000
        typesafeEndpoint: https://api.typesafe.ai/v1/systemone
        typesafeModel: jev-latest
        typesafeApiKeyEnv: TYPESAFE_API_KEY
        typesafeTimeoutMs: 20000
        typesafeRetries: 1
